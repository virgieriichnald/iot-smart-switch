services:
  # MQTT Broker (Eclipse Mosquitto)
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: iot_mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - iot-network

  # PHP-FPM Application Server (Laravel 13)
  app:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    container_name: iot_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./server:/var/www/html
    environment:
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
    depends_on:
      - mosquitto
    networks:
      - iot-network

  # Nginx Web Server
  web:
    image: nginx:alpine
    container_name: iot_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./server:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - iot-network

  # Background MQTT Listener & Auto-Discovery Worker
  mqtt-worker:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    container_name: iot_mqtt_worker
    restart: unless-stopped
    working_dir: /var/www/html
    command: sh -c "sleep 5 && php artisan mqtt:listen"
    volumes:
      - ./server:/var/www/html
    environment:
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
    depends_on:
      - mosquitto
      - app
    networks:
      - iot-network

networks:
  iot-network:
    driver: bridge

volumes:
  mosquitto_data:
  mosquitto_log:
